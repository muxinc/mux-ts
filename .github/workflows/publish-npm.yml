name: Publish NPM

# Publishes the released tree as @mux/ts, @mux/mux-node (same-version alias),
# and @mux/mcp (packages/mcp-server) via npm trusted publishing (OIDC) — no
# npm token exists anywhere. The publish logic lives in bin/publish-npm-all.
# On release events the MCP desktop-extension bundle (mux.mcpb, produced by
# the @mux/mcp build) is also attached to the GitHub Release. Announcing the
# server to the MCP registry is a separate concern and not part of this
# workflow.
on:
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    if: github.repository == 'muxinc/mux-ts'
    permissions:
      # contents: write is for the mux.mcpb release-asset upload.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # bin/publish-npm vendors an OIDC-capable npm for the publish itself;
          # a current Node keeps the native npm capable too.
          node-version: '24'

      - name: Install dependencies
        run: yarn install

      - name: Publish @mux/ts, @mux/mux-node alias, @mux/mcp
        run: bash ./bin/publish-npm-all

      - name: Upload MCP server .mcpb release asset
        # Dispatch runs have no release to attach to; skip rather than fail.
        # The bundle only exists when this run built @mux/mcp (a rerun that
        # skipped an already-published @mux/mcp has nothing to upload).
        if: github.event_name == 'release'
        run: |
          if [ -f packages/mcp-server/mux.mcpb ]; then
            gh release upload "$TAG_NAME" packages/mcp-server/mux.mcpb --clobber
          else
            echo "mux.mcpb not built this run (publish skipped) — nothing to upload."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
