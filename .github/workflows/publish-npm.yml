name: Publish NPM

# Publishes the released tree as @mux/ts and @mux/mux-node (alias) via npm
# trusted publishing (OIDC) — no npm token exists anywhere. The dual-publish
# logic lives in bin/publish-npm-dual. packages/mcp-server is not published
# by this workflow.
on:
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    if: github.repository == 'muxinc/mux-ts'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # bin/publish-npm vendors an OIDC-capable npm for the publish itself;
          # a current Node keeps the native npm capable too.
          node-version: '24'

      - name: Install dependencies
        run: yarn install

      - name: Publish @mux/ts + @mux/mux-node alias
        run: bash ./bin/publish-npm-dual
